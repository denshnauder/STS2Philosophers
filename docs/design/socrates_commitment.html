  function create(id, variant = "C1") {
    const c = fixtures.find(x => x.id === id);
    if (!c) throw new Error("Unknown paper case");
    if (!["C1","C2"].includes(variant)) throw new Error("Unknown paper variant");
    const incoming = c.enemies.reduce((n,e) => n + e.attack, 0);
    const threshold = variant === "C2" ? Math.ceil(incoming/2) : incoming;
    return {
      caseId: id, variant, energy: c.energy, block: c.initialBlock || 0, playerHp: 40,
      enemies: c.enemies.map(e => ({...e})), cards: c.cards.map(a => [...a]),
      used: [], history: [], committed: false, mode: null, ended: false,
      inherited: c.inherited || null, revised: false, target: c.target || 0,
      threshold, frozenAttackers: c.enemies.filter(e=>e.hp>0 && e.attack>0).map(e=>e.id),
      guardEligible: threshold > (c.initialBlock || 0)
    };
  }
  function canChoose(s, mode, target) {
    if (s.committed || s.ended) return false;
    if (mode === "skip") return true;
    if (mode === "guard") return s.guardEligible && s.threshold > 0;
    if (mode === "clear" && s.variant === "C2") return s.frozenAttackers.length > 0;
    return mode === "clear" && Number.isInteger(target) &&
      !!s.enemies[target] && s.enemies[target].hp > 0 && s.enemies[target].attack > 0;
  }
  function commit(s, mode, target = s.target) {
    if (!canChoose(s,mode,target)) return false;
    s.revised = mode !== "skip" && !!s.inherited && mode !== s.inherited;
    s.committed = true; s.mode = mode; s.target = target;
    s.history.push(mode === "skip" ? "放弃本轮收益" :
      (s.revised ? "修订为" : "试行") + (mode === "guard" ? "防护" : "解围"));
    return true;
  }
  function canPlay(s, i, target) {
    const card = s.cards[i];
    return s.committed && !s.ended && s.enemies.some(e => e.hp > 0) &&
      Number.isInteger(i) && !!card && !s.used.includes(i) && card[1] <= s.energy &&
      (card[2] === 0 || (Number.isInteger(target) && !!s.enemies[target] && s.enemies[target].hp > 0));
  }
  function play(s, i, target = 0) {
    if (!canPlay(s,i,target)) return false;
    const [name,cost,damage,shield] = s.cards[i];
    s.energy -= cost; s.block += shield; s.used.push(i);
    if (damage) s.enemies[target].hp = Math.max(0,s.enemies[target].hp - damage);
    s.history.push(name + (damage ? "→" + s.enemies[target].id : ""));
    if (s.enemies.every(e => e.hp === 0)) finish(s);
    return true;
  }
  function outcome(s) {
    const won = s.enemies.every(e => e.hp <= 0);
    const incoming = s.enemies.reduce((n,e) => n + (e.hp > 0 ? (e.actualAttack ?? e.attack) : 0),0);
    const unblockedDamage = Math.max(0,incoming-s.block);
    const loss = Math.min(s.playerHp,unblockedDamage), survived = unblockedDamage < s.playerHp;
    const guardMet = s.guardEligible && s.threshold > 0 && s.block >= s.threshold;
    const e = s.enemies[s.target];
    const clearMet = s.variant === "C2" ?
      s.enemies.some(e=>s.frozenAttackers.includes(e.id) && e.hp<=0) : !!e && e.attack > 0 && e.hp <= 0;
    const canReceive = !won && survived;
    const guardDraw = canReceive && guardMet ? 1 : 0;
    const clearDraw = canReceive && clearMet ? 2 : 0;
    const draw = s.revised ? 0 : s.mode === "guard" ? guardDraw : s.mode === "clear" ? clearDraw : 0;
    return {won, incoming, loss, survived, guardMet, clearMet, guardDraw, clearDraw, draw,
      enemyHp: s.enemies.reduce((n,e) => n+e.hp,0)};
  }
  function finish(s) {
    if (s.ended || !s.committed) return false;
    s.result = outcome(s); s.ended = true; s.history.push(s.result.won ? "战斗结束" : "结束回合");
    return true;
  }

    const start = create(id, variant), rows = [];
    commit(start,"skip");
    function visit(s) {
      rows.push({...outcome(s), steps:s.history.join(" / ")});
      if (s.ended) return;
      for (let i=0;i<s.cards.length;i++) {
        const targets = s.cards[i][2] ? s.enemies.map((e,j)=>j) : [0];
        for (const target of targets) {
          if (!canPlay(s,i,target)) continue;
          const next = JSON.parse(JSON.stringify(s));
          play(next,i,target); visit(next);
        }
      }
    }
    visit(start); return rows;
  }

  }
  function reset() {
    state=SocratesPaper.create(caseSelect.value, variantSelect.value);
    targetSelect.replaceChildren(); attackSelect.replaceChildren();
    state.enemies.forEach((e,i)=>{

    });

  }

    const s=state;
    $("[data-state]").textContent="能量 "+s.energy+" · 格挡 "+s.block+" · 初始生命 "+s.playerHp;
    $("[data-enemies]").textContent=s.enemies.map(e=>e.id+"：生命 "+e.hp+" / "+
      (e.hp<=0?"已击败":"攻击 "+(s.ended?(e.actualAttack??e.attack):e.attack))).join("　");
    const clearScope=s.variant==="C2"?"集合中任一敌人":"指定目标";
    const targetLabel=s.variant==="C2"?s.frozenAttackers.join("、"):s.enemies[s.target]?.id;
    $("[data-criterion]").textContent=s.variant+" 本轮冻结目标："+s.threshold+" 格挡；防护达标下轮抽1，"+clearScope+"死亡下轮抽2；战斗结束无奖励。"+

    $("[data-single-target]").hidden=s.variant==="C2";
    targetSelect.disabled=s.committed||s.ended;
    root.querySelectorAll("[data-choose]").forEach(b=>{
      b.disabled=!SocratesPaper.canChoose(s,b.dataset.choose,Number(targetSelect.value));
    });
    $("[data-goal]").textContent=s.committed?
      (s.mode==="skip"?"本轮主动放弃收益":
        "已冻结："+label(s.mode)+(s.mode==="clear"?"，目标"+targetLabel:"，目标"+s.threshold+"格挡")+
        (s.revised?"；修订回合无新增奖励":"")):
      (s.variant==="C2"?"行动前威胁集合："+(targetLabel||"无")+"。":"")+
      (!s.guardEligible?"防护无新增要求；不把已有格挡算作一次主动达标。":"");
    const hand=$("[data-hand]"); hand.replaceChildren();
    if(s.enemies[Number(attackSelect.value)]?.hp <= 0 && s.enemies.some(e=>e.hp>0))
      attackSelect.value=String(s.enemies.findIndex(e=>e.hp>0));
    s.cards.forEach(([name,cost,damage,shield],i)=>{
      hand.append(makeButton(name+" · "+cost+"费"+(damage?" / "+damage+"伤害":"")+(shield?" / "+shield+"格挡":""),
        ()=>{SocratesPaper.play(s,i,Number(attackSelect.value));render();},
        !SocratesPaper.canPlay(s,i,Number(attackSelect.value))));
    });
    Array.from(attackSelect.options).forEach((o,i)=>o.disabled=s.enemies[i].hp<=0);
    attackSelect.disabled=s.ended;
    $("[data-end]").disabled=!s.committed||s.ended;
    const result=$("[data-result]");
    if(s.ended){
      const r=s.result;
      const metric=s.mode==="skip"?"本轮未试行":(s.mode==="guard"?r.guardMet:r.clearMet)?"所选指标达成":"所选指标未达成";
      result.textContent=metric+" · 本轮生命损失 "+r.loss+" · 次回合可领抽牌 "+r.draw+
        "\n"+(r.won?"战斗已结束，没有次回合奖励。":!r.survived?"角色未存活，没有次回合奖励。":
          s.revised?"修订代价已计入；本页不推演下一回合。":
          s.enemies.some(e=>e.hp>0&&e.actualAttack!==undefined)?"本例在结束回合后改变攻击量；冻结指标不保证无伤。":
          "只核对这一轮，不判定整场最优或哲学立场正确。");
    } else result.textContent="待结算";
    $("[data-history]").textContent=s.history.join(" → ");
  }

  attackSelect.addEventListener("change",render);
  root.querySelectorAll("[data-choose]").forEach(b=>b.addEventListener("click",()=>{

  }));
  $("[data-end]").addEventListener("click",()=>{SocratesPaper.finish(state);render();});
  reset();

        {intents:[0,0,16],cards:[attack,["防一",1,0,8],["防二",1,0,8]]},
        {intents:[4,4,8],cards:[attack,["攻二",1,6,0],defend]},
        {intents:[0,0,null],actual:[0,0,10],cards:[attack,defend,defend2]},
        {intents:[0,4,8],cards:[attack,["攻二",1,6,0],defend]},
        {intents:[4,0,12],cards:[attack,["防一",1,0,8],["防二",1,0,8]]}
      ]
    },
    hidden: {hp:40,enemies:[["甲",30]],turns:[
      {intents:[null],actual:[8],cards:[attack,defend]},
      {intents:[8],cards:[attack,defend]}
    ]},
    prepared: {hp:40,enemies:[["甲",30]],turns:[
      {intents:[8],block:4,cards:[attack,defend]},
      {intents:[8],cards:[attack,defend]}
    ]},
    short: {hp:40,enemies:[["甲",6]],turns:[{intents:[8],cards:[attack,defend]}]}
  };
  function open(s) {
    const turn = s.script[s.round-1];
    s.received=s.pending; s.requests+=s.pending; s.pending=0;
    s.energy=2; s.block=turn.block||0; s.initialBlock=s.block;
    s.cards=turn.cards.map(c=>[...c]); s.used=[]; s.locked=false; s.changed=false; s.revised=false; s.closed=false;
    s.enemies.forEach((e,i)=>{
      e.publicDamage=turn.intents[i]; e.actualDamage=turn.actual?.[i] ?? turn.intents[i];
      e.visibleAttack=e.hp>0 && typeof e.publicDamage==="number" && e.publicDamage>0;
    });
    const alive=s.enemies.filter(e=>e.hp>0);
    s.incoming=alive.some(e=>e.publicDamage===null)?null:alive.reduce((n,e)=>n+e.publicDamage,0);
    s.threshold=s.incoming===null?null:Math.ceil(s.incoming/2);
    s.frozen=alive.filter(e=>e.visibleAttack).map(e=>e.id);
  }
  function create(id="revisions") {
    const f=fixtures[id]; if(!f) throw new Error("Unknown C3 paper case");
    const s={caseId:id,script:JSON.parse(JSON.stringify(f.turns)),round:1,hp:f.hp,
      enemies:f.enemies.map(([id,hp])=>({id,hp})),mode:null,declined:false,pending:0,requests:0,terminal:false,history:[],result:null};
    open(s); return s;
  }
  const invitation=s=>!s.mode && !s.declined && s.frozen.length>0;
  function canSelect(s,mode) {
    return !s.closed && !s.terminal && !s.locked && !s.changed && !s.declined &&
      ["guard","clear"].includes(mode) && mode!==s.mode && (!!s.mode || invitation(s));
  }
  function select(s,mode) {
    if(!canSelect(s,mode)) return false;
    s.revised=!!s.mode; s.mode=mode; s.changed=true; return true;
  }
  function decline(s) {
    if(s.closed || s.terminal || s.locked || s.changed || !invitation(s)) return false;
    s.declined=s.changed=true; return true;
  }
  const canAct=s=>!s.closed && !s.terminal && !invitation(s);
  function canPlay(s,i,target) {
    const c=s.cards[i];
    return canAct(s) && Number.isInteger(i) && !!c && !s.used.includes(i) && c[1]<=s.energy &&
      (!c[2] || (Number.isInteger(target) && !!s.enemies[target] && s.enemies[target].hp>0));
  }
  function play(s,i,target=0) {
    if(!canPlay(s,i,target)) return false;
    const [,cost,damage,block]=s.cards[i];
    s.locked=true; s.energy-=cost; s.block+=block; s.used.push(i);
    if(damage) s.enemies[target].hp=Math.max(0,s.enemies[target].hp-damage);
    if(s.enemies.every(e=>e.hp===0)) finish(s);
    return true;
  }
  function observe(s) {
    if(!s.mode) return "none";
    if(s.mode==="guard") {
      if(s.threshold===null) return "incomplete";
      if(s.threshold<=s.initialBlock) return "no_condition";
      return s.block>=s.threshold?"met":"unmet";
    }
    if(!s.frozen.length) return "no_condition";
    return s.enemies.some(e=>s.frozen.includes(e.id)&&e.hp===0)?"met":"unmet";
  }
  function finish(s) {
    if(!canAct(s)) return false;
    s.locked=true; s.closed=true;
    const metric=observe(s), won=s.enemies.every(e=>e.hp===0);
    const damage=s.enemies.reduce((n,e)=>n+(e.hp>0?e.actualDamage:0),0);
    const loss=Math.min(s.hp,Math.max(0,damage-s.block)); s.hp-=loss;
    s.terminal=won||s.hp===0;
    s.pending=!s.terminal && !s.revised && metric==="met"?1:0;
    s.result={round:s.round,metric,loss,won,dead:s.hp===0,pending:s.pending,revised:s.revised};
    s.history.push({...s.result,mode:s.mode,received:s.received}); return true;
  }
  function next(s) {
    if(!s.closed || s.terminal || s.round>=s.script.length) return false;
    s.round++; open(s); return true;
  }
  return {create,invitation,canSelect,select,decline,canAct,canPlay,play,observe,finish,next};
})();
// END C3 PAPER MODEL
(() => {
  const root=document.getElementById("socrates-c3"), $=q=>root.querySelector(q);
  const picker=$("[data-c3-case]"), target=$("[data-c3-target]");
  const names={guard:"防护",clear:"解围"};
  const metrics={none:"未参与",incomplete:"记录不足",no_condition:"条件未出现",met:"指标达成",unmet:"指标未达成"};
  let s;
  function button(label,action,disabled=false) {
    const b=document.createElement("button"); b.type="button"; b.className="btn"; b.textContent=label;
    b.disabled=disabled; b.addEventListener("click",()=>{action();render();}); return b;
  }
  function reset(){s=SocratesC3Paper.create(picker.value);target.replaceChildren();
    s.enemies.forEach((e,i)=>{const o=document.createElement("option");o.value=String(i);o.textContent=e.id;target.append(o);});render();}
  function render() {
    $("[data-c3-state]").textContent=`第${s.round}回合 · 生命 ${s.hp} · 能量 ${s.energy} · 格挡 ${s.block} · 本轮抽牌请求 ${s.received}`;
    $("[data-c3-enemies]").textContent=s.enemies.map(e=>e.id+"："+(e.hp===0?"已击败":
      `生命 ${e.hp} / `+(e.publicDamage===null?"意图不明":e.visibleAttack?`攻击 ${e.publicDamage}`:"不攻击"))).join("　");
    const guard=s.threshold===null?"防护目标不明":`防护目标 ${s.threshold} 格挡`;
    const scope="解围范围 "+(s.frozen.join("、")||"无");
    const current=s.declined?"本战不参与":!s.mode?(SocratesC3Paper.invitation(s)?"首次选择 · 达成后下一正常回合抽1":"尚无公开攻击 · 正常行动"):
      (s.revised?"已修订为":s.changed?"开始试行":"沿用")+names[s.mode]+
      (s.revised?" · 本轮不产生新收益":s.locked?" · 本轮已锁定":" · 可直接行动，无需确认");
    $("[data-c3-goal]").textContent=current+"\n"+guard+"；"+scope+
      (s.threshold!==null&&s.threshold<=s.initialBlock?"；初始格挡已足，本轮防护无新增收益条件":"");
    const choices=$("[data-c3-choices]");choices.replaceChildren();
    if(!s.declined && (s.mode || SocratesC3Paper.invitation(s))) {
      for(const mode of ["guard","clear"]) if(mode!==s.mode) choices.append(button(
        (s.mode?"修订为":"试行")+names[mode]+(s.mode?"（本轮无新收益）":""),
        ()=>SocratesC3Paper.select(s,mode),!SocratesC3Paper.canSelect(s,mode)));
      if(!s.mode)choices.append(button("本战不参与",()=>SocratesC3Paper.decline(s),!SocratesC3Paper.invitation(s)));
    }
    if(s.enemies[Number(target.value)]?.hp===0 && s.enemies.some(e=>e.hp>0)) target.value=String(s.enemies.findIndex(e=>e.hp>0));
    Array.from(target.options).forEach((o,i)=>o.disabled=s.enemies[i].hp===0); target.disabled=s.closed||s.terminal;
    const hand=$("[data-c3-hand]");hand.replaceChildren();
    s.cards.forEach(([name,cost,damage,block],i)=>hand.append(button(
      `${name} · ${cost}费 / ${damage?damage+"伤害":block+"格挡"}`,
      ()=>SocratesC3Paper.play(s,i,Number(target.value)),!SocratesC3Paper.canPlay(s,i,Number(target.value)))));
    $("[data-c3-end]").disabled=!SocratesC3Paper.canAct(s);
    $("[data-c3-next]").disabled=!s.closed||s.terminal||s.round>=s.script.length;
    $("[data-c3-next]").hidden=!s.closed;
    const r=s.result;
    $("[data-c3-result]").textContent=r?`第${r.round}回合：${metrics[r.metric]} · 实际失血 ${r.loss} · 当时待发抽牌 ${r.pending}\n`+
      (r.won?"战斗结束，未领收益清空":r.dead?"角色死亡，未领收益清空":s.closed&&s.round>=s.script.length?
        `片段结束，战斗未结束；${s.pending} 次请求尚未领取`:s.closed?"下一回合先领取，再作新的判断":
        `本轮已消费 ${s.received} 次请求；未生成额外手牌`):"等待本轮观察";
    $("[data-c3-history]").textContent=s.history.map(h=>`第${h.round}轮 ${names[h.mode]||"未参与"}${h.revised?"（修订）":""}：${metrics[h.metric]}，失血${h.loss}`).join(" / ");
  }
  picker.addEventListener("change",reset);target.addEventListener("change",render);
  $("[data-c3-retry]").addEventListener("click",reset);
  $("[data-c3-end]").addEventListener("click",()=>{SocratesC3Paper.finish(s);render();});
  $("[data-c3-next]").addEventListener("click",()=>{SocratesC3Paper.next(s);render();});reset();
})();
</script>
